name: Диагностика — карточки ЭК
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Ссылки на карточки через пробел"
        required: true
concurrency:
  group: yandex-worker
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python debug_pair.py ${{ inputs.urls }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug_html
          path: debug_html/
          if-no-files-found: ignore
