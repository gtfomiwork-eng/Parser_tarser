name: Обогащение — uuid аудиокниг через парные ЭК
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Карточек ЭК за запуск"
        default: "200"
concurrency:
  group: yandex-worker
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python enrich_audio_uuids.py --limit ${{ inputs.limit }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
